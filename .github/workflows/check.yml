name: check

on:
  push:
  pull_request:

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Ledger is consistent and predictions are append-only
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=""; fi
          python -m ledger validate $base
      - name: Derived files are up to date
        run: |
          python -m ledger scorecard
          git diff --exit-code -- scorecard.json data/setups.csv README.md reports/daily
